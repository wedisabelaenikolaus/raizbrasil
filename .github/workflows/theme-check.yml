name: Theme Check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Theme Check
        run: shopify theme check --fail-level error
      - name: Validate JSON templates and locales
        run: |
          for f in templates/*.json sections/*.json config/*.json locales/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
